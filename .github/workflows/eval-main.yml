# After merge: run every skill's regression set on the real model. Catches interactions
# the per-PR run (changed skills only) can miss, and records a baseline as an artifact.
name: eval-main

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: eval-main
  cancel-in-progress: false

env:
  CLAUDE_CODE_VERSION: "2.1.318"

jobs:
  regression:
    name: regression-all-skills
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Install Claude Code
        run: npm install -g "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}"

      - name: Regression set, all skills
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AITK_MAX_USD: ${{ vars.AITK_MAIN_MAX_USD || '10' }}
        run: ./scripts/eval.sh --out .aitk/results/main --quiet

      - name: Publish summary
        if: always()
        run: if [ -f .aitk/results/main/summary.md ]; then cat .aitk/results/main/summary.md >> "$GITHUB_STEP_SUMMARY"; fi

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: eval-results-main-${{ github.sha }}
          path: .aitk/results/main
          retention-days: 90
          if-no-files-found: ignore
