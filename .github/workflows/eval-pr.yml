# PR quality gate (required check: eval-gate).
#
# Every PR: harness tests, static validation, and the append-only rule on evals/.
# PRs that change a skill (or shared grading files): that skill's regression set
# runs against the real model through headless Claude Code, under a dollar cap.
#
# `pull_request` (never `pull_request_target`) means fork PRs get no secrets. A PR
# that changes a skill but cannot get the API key fails rather than skipping.
# A red check blocks merging only if a ruleset requires eval-gate
# (scripts/github-protection.sh).
name: eval

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]

permissions:
  contents: read

concurrency:
  group: eval-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  CLAUDE_CODE_VERSION: "2.1.318"

jobs:
  gate:
    name: eval-gate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Harness tests
        run: ./scripts/test.sh

      - name: Static validation
        if: success() || failure()
        run: ./scripts/eval.sh --static --out .aitk/results/static --quiet

      - name: Evals are append-only
        if: success() || failure()
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          APPROVED: ${{ contains(github.event.pull_request.labels.*.name, 'criteria-change-approved') }}
        run: |
          flag=""
          if [ "$APPROVED" = "true" ]; then flag="--allow-criteria-change"; fi
          ./scripts/aitk integrity --base "$BASE_SHA" $flag

      - name: Which skills changed
        id: changed
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          names="$(PYTHONPATH=tools python3 -c 'import sys; from aitk import cli; print(" ".join(cli.changed_skills(sys.argv[1])))' "$BASE_SHA")"
          echo "skills=$names" >> "$GITHUB_OUTPUT"
          echo "Changed skills: ${names:-none}"

      - name: Install Claude Code
        if: steps.changed.outputs.skills != ''
        run: npm install -g "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}"

      - name: Regression set on the real model (changed skills only)
        if: steps.changed.outputs.skills != ''
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          AITK_MAX_USD: ${{ vars.AITK_PR_MAX_USD || '5' }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::error::This PR changes skills (${{ steps.changed.outputs.skills }}) but ANTHROPIC_API_KEY is not available (fork PR or missing secret)."
            exit 1
          fi
          ./scripts/eval.sh --changed-since "$BASE_SHA" --out .aitk/results/pr --quiet

      - name: Publish summary
        if: always()
        run: |
          for f in .aitk/results/pr/summary.md .aitk/results/static/summary.md; do
            if [ -f "$f" ]; then cat "$f" >> "$GITHUB_STEP_SUMMARY"; break; fi
          done

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: eval-results-pr
          path: .aitk/results
          retention-days: 14
          if-no-files-found: ignore
